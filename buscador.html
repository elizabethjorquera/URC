    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const resourceBlobs = {};

      const u = URL.createObjectURL(pageBlob);

      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);

      delete pendingRelays[uuid];

          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        if (ownFrameWindows().indexOf(e.source) < 0) return;

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;

    // consumers read these Blobs directly. Survives the swap like the error sink.

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tion:none;\">Dashboard<\u002Fa>\n        <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; font-weight: 500; padding: 8px 14px; border: 1px solid #2E2A26; background: #2E2A26; color: #FBF7F0;\">Buscador<\u002Fspan>\n      <\u002Fnav>\n    <\u002Fheader>\n\n    <section style=\"background: #FFFFFF; border: 1px solid #E4DCCE; padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px;\">\n      <label style=\"display: flex; flex-direction: column; gap: 8px;\">\n        <span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6259;\">Buscar<\u002Fspan>\n        <input type=\"search\" value=\"{{ q }}\" sc-camel-on-input=\"{{ onQuery }}\" placeholder=\"Código, organización, RUT, nombre del proyecto o comuna\" style=\"width: 100%; font-size: 17px; padding: 13px 16px; border: 1px solid #2E2A26; background: #FBF7F0; color: #2E2A26;\">\n      <\u002Flabel>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end;\">\n        <sc-for list=\"{{ selects }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <label style=\"display: flex; flex-direction: column; gap: 8px; min-width: 180px; flex: 1 1 180px;\">\n            <span style=\"font-size: 12px; font-weight: 600; color: #6B6259;\">{{ s.label }}<\u002Fspan>\n            <sc-raw-select value=\"{{ s.value }}\" sc-camel-on-change=\"{{ s.onChange }}\" style=\"appearance: none; width: 100%; font-size: 14px; padding: 9px 12px; border: 1px solid #CFC4B2; background: #FBF7F0; color: #2E2A26; cursor: pointer;\">\n              <sc-for list=\"{{ s.options }}\" as=\"o\" hint-placeholder-count=\"3\">\n                <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-top: 1px solid #F0E9DC; padding-top: 12px;\">\n        <span style=\"font-size: 14px; color: #4A443D;\">{{ resumen }}<\u002Fspan>\n        <div style=\"display: flex; gap: 8px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ csv }}\" style=\"font-size: 13px; font-weight: 600; background: none; border: 1px solid #CFC4B2; padding: 7px 13px; cursor: pointer; color: #2E2A26;\" style-hover=\"background:#F1EADD; border-color:#2E2A26;\">Descargar CSV<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ reset }}\" style=\"font-size: 13px; font-weight: 600; background: none; border: 1px solid #CFC4B2; padding: 7px 13px; cursor: pointer; color: #2E2A26;\" style-hover=\"background:#F1EADD; border-color:#2E2A26;\">Limpiar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; gap: 10px;\">\n      <sc-for list=\"{{ results }}\" as=\"r\" hint-placeholder-count=\"8\">\n        <article style=\"background: #FFFFFF; border: 1px solid #E4DCCE; border-left: 5px solid {{ r.color }}; padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-start; justify-content: space-between;\">\n          <div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 7px;\">\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;\">\n              <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700;\">{{ r.codigo }}<\u002Fspan>\n              <span style=\"display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 3px 10px 3px 8px; background: #F1EADD; color: #2E2A26; font-weight: 600; letter-spacing: 0.02em;\"><span style=\"width: 9px; height: 9px; background: {{ r.color }}; display: block; flex: 0 0 auto;\"><\u002Fspan>{{ r.estado }}<\u002Fspan>\n              <span style=\"font-size: 13px; color: #6B6259;\">{{ r.anioConcurso }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size: 16px; font-weight: 600; line-height: 1.3; text-wrap: pretty;\">{{ r.proyecto }}<\u002Fspan>\n            <span style=\"font-size: 13.5px; color: #4A443D; line-height: 1.4;\">{{ r.organizacion }}<\u002Fspan>\n            <span style=\"font-size: 12.5px; color: #6B6259;\">{{ r.lugar }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 2px;\">\n            <span style=\"font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6259;\">Monto solicitado<\u002Fspan>\n            <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;\">{{ r.monto }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ hayMas }}\" hint-placeholder-val=\"{{ false }}\">\n      <button type=\"button\" sc-camel-on-click=\"{{ verMas }}\" style=\"align-self: center; font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; padding: 12px 26px; border: 1px solid #2E2A26; background: #FBF7F0; color: #2E2A26; cursor: pointer;\" style-hover=\"background:#2E2A26; color:#FBF7F0;\">{{ verMasLabel }}<\u002Fbutton>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ vacio }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background: #FFFFFF; border: 1px dashed #CFC4B2; padding: 40px 24px; text-align: center; color: #6B6259; font-size: 15px;\">Sin resultados para esta búsqueda.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <footer style=\"display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; font-size: 12px; color: #6B6259; border-top: 1px solid #E4DCCE; padding-top: 14px;\">\n      <span>Fuente: PLANILLA CORRESPONDENCIA — hoja «Base de datos general». {{ totalRows }} registros.<\u002Fspan>\n      <span>Los montos corresponden a Monto Solicitado ($).<\u002Fspan>\n    <\u002Ffooter>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;porPagina&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:40,&quot;min&quot;:10,&quot;max&quot;:200,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Buscador&quot;}}\">\nconst COLORS = {\n  'CERTIFICADO TOTAL': '#1B7F4B',\n  'CERTIFICADO PARCIAL': '#5AA870',\n  'EJECUCIÓN': '#2F7FBF',\n  'EN REVISIÓN': '#C9AC1F',\n  'OBSERVADO': '#C4831F',\n  'RESPUESTA OBSERVACIONES': '#A88A55',\n  'NO TRAMITADO': '#A8552A',\n  'SIN RENDIR': '#C6553F',\n  'SIN RENDIR FISCALIA': '#8C3A2E',\n  'FISCALIA': '#5F241D',\n  'DEVOLUCIÓN TOTAL': '#5C6878',\n  'CASTIGO CONTABLE': '#7E7690',\n  'SUSPENDIDO': '#8A7A5E',\n  '(Sin dato)': '#A39A8B'\n};\nconst lum = (hex) => {\n  const c = hex.replace('#', '');\n  const v = [0, 2, 4].map((i) => {\n    const x = parseInt(c.slice(i, i + 2), 16) / 255;\n    return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);\n  });\n  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];\n};\nconst ink = (hex) => (lum(hex) > 0.18 ? '#2E2A26' : '#FFFFFF');\nconst norm = (s) => (s || '').toString().toUpperCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '');\n\nclass Component extends DCLogic {\n  state = { q: '', anio: '', concurso: '', estado: '', prov: '', comuna: '', limit: 40, ready: false };\n\n  componentDidMount() {\n    if (window.DETALLE) { this.prep(); return; }\n    this._t = setInterval(() => { if (window.DETALLE) { clearInterval(this._t); this.prep(); } }, 60);\n  }\n  componentWillUnmount() { if (this._t) clearInterval(this._t); }\n\n  prep() {\n    this._rows = window.DETALLE.map((r, i) => ({ r, k: norm(r[0] + ' ' + r[4] + ' ' + r[5] + ' ' + r[8] + ' ' + r[7] + ' ' + r[6] + ' ' + r[2]), i }));\n    this.setState({ ready: true });\n  }\n\n  get step() { return this.props.porPagina ?? 40; }\n  fmtN(n) { return Math.round(n).toLocaleString('es-CL'); }\n  fmtP(n) { return '$' + this.fmtN(n); }\n\n  match(o, skip) {\n    const s = this.state;\n    const r = o.r;\n    if (skip !== 1 && s.anio && r[1] !== s.anio) return false;\n    if (skip !== 2 && s.concurso && r[2] !== s.concurso) return false;\n    if (skip !== 3 && s.estado && r[3] !== s.estado) return false;\n    if (skip !== 6 && s.prov && r[6] !== s.prov) return false;\n    if (skip !== 7 && s.comuna && r[7] !== s.comuna) return false;\n    if (this._terms) for (const t of this._terms) if (o.k.indexOf(t) === -1) return false;\n    return true;\n  }\n\n  optionsFor(idx, label) {\n    const m = new Map();\n    for (const o of this._rows) if (this.match(o, idx)) { const k = o.r[idx] || '(Sin dato)'; m.set(k, (m.get(k) || 0) + 1); }\n    const arr = [...m.entries()].sort((a, b) => b[1] - a[1]).map(([v, c]) => ({ value: v, label: v + ' (' + this.fmtN(c) + ')' }));\n    return [{ value: '', label }].concat(arr);\n  }\n\n  downloadCSV(rows) {\n    const head = ['Código', 'Año', 'Concurso', 'Estado URC', 'Nombre o razón social', 'Rut Organización', 'Provincia', 'Comuna', 'Nombre Proyecto', 'Monto Solicitado'];\n    const esc = (v) => '\"' + String(v).replace(/\"/g, '\"\"') + '\"';\n    const csv = '\\uFEFF' + [head.map(esc).join(';')].concat(rows.map((o) => o.r.map(esc).join(';'))).join('\\r\\n');\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));\n    a.download = 'busqueda-proyectos.csv';\n    a.click();\n    setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n  }\n\n  renderVals() {\n    if (!this._rows) return { resumen: 'Cargando 8.768 registros…', totalRows: '8.768', q: this.state.q, hayMas: false, vacio: false, results: [], selects: [] };\n    const s = this.state;\n    const qn = norm(s.q).trim();\n    this._terms = qn ? qn.split(/\\s+/) : null;\n\n    const found = this._rows.filter((o) => this.match(o, -1));\n    const monto = found.reduce((a, o) => a + o.r[9], 0);\n    const step = this.step;\n    const shown = found.slice(0, Math.max(s.limit, step));\n\n    const mk = (label, key, idx, all) => ({\n      label, value: s[key], options: this.optionsFor(idx, all),\n      onChange: (e) => this.setState({ [key]: e.target.value, limit: this.step })\n    });\n\n    return {\n      q: s.q,\n      onQuery: (e) => this.setState({ q: e.target.value, limit: this.step }),\n      selects: [\n        mk('Año', 'anio', 1, 'Todos los años'),\n        mk('Concurso', 'concurso', 2, 'Todos los concursos'),\n        mk('Estado URC', 'estado', 3, 'Todos los estados'),\n        mk('Provincia', 'prov', 6, 'Todas las provincias'),\n        mk('Comuna', 'comuna', 7, 'Todas las comunas')\n      ],\n      resumen: this.fmtN(found.length) + ' de ' + this.fmtN(this._rows.length) + ' proyectos · ' + this.fmtP(monto),\n      results: shown.map((o) => {\n        const r = o.r;\n        return {\n          codigo: r[0] || '(sin código)',\n          estado: r[3],\n          color: COLORS[r[3]] || '#A39A8B',\n          ink: ink(COLORS[r[3]] || '#A39A8B'),\n          anioConcurso: [r[1], r[2]].filter(Boolean).join(' · ') || 'Sin año',\n          proyecto: r[8] || '(Sin nombre de proyecto)',\n          organizacion: [r[4], r[5]].filter(Boolean).join(' · RUT ') || 'Organización sin registrar',\n          lugar: [r[7], r[6]].filter(Boolean).join(', '),\n          monto: this.fmtP(r[9])\n        };\n      }),\n      hayMas: found.length > shown.length,\n      verMasLabel: 'Ver ' + step + ' más (' + this.fmtN(found.length - shown.length) + ' restantes)',\n      verMas: () => this.setState((st) => ({ limit: Math.max(st.limit, step) + step })),\n      vacio: found.length === 0,\n      csv: () => this.downloadCSV(found),\n      reset: () => this.setState({ q: '', anio: '', concurso: '', estado: '', prov: '', comuna: '', limit: this.step }),\n      totalRows: this.fmtN(this._rows.length)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
